name: Lambda Tests

env:
  UV_SYSTEM_PYTHON: 1

defaults:
  run:
    working-directory: ./lambda

on:
  push:
    paths: ['lambda/**', 'smithy/**', '.github/workflows/lambda-tests.yml']
    branches: [ "mainline" ]
  pull_request:
    paths: ['lambda/**', 'smithy/**', '.github/workflows/lambda-tests.yml']
    branches: [ "mainline" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 17
          cache: gradle

      - name: Build smithy
        working-directory: smithy
        run: ./gradlew smithyBuild

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Enable caching
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --group dev .

      - name: Generate pydantic models from smithy
        env:
          SMITHY_BUILD_DIR: ${{ github.workspace }}/build/smithy
        run: ./scripts/codegen.sh

      - name: Check code formatting with black
        run: |
          black --check --diff src/ tests/

      - name: Check import sorting with isort
        run: |
          isort --check-only --diff src/ tests/

      - name: Run flake8 linting
        run: |
          flake8 src/ tests/

      - name: Run mypy type checking
        run: |
          mypy

      - name: Run tests with coverage
        run: |
          pytest
        env:
          COVERAGE_FILE: .coverage

      - name: Store coverage file
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lambda/.coverage
          include-hidden-files: true

  coverage:
    name: coverage
    runs-on: ubuntu-26.04-arm
    needs: test
    # A PR comment is the only thing this job produces; on push it downloads an
    # artifact and posts nothing.
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage
          merge-multiple: true
          path: lambda/

      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_PATH: lambda/
          MERGE_COVERAGE_FILES: true

      - name: Store Pull Request comment to be posted
        uses: actions/upload-artifact@v7
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
