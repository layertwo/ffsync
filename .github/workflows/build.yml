name: build

on:
  workflow_call:

jobs:
  smithy:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 17
          cache: gradle

      - name: Build Smithy model
        working-directory: smithy
        run: ./gradlew smithyBuild

      - uses: actions/upload-artifact@v7
        with:
          name: smithy-output
          path: build/smithy
          retention-days: 1

  frontend:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm test && npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  synth:
    needs: [smithy, frontend]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: docker/setup-buildx-action@v4
        with:
          use: true
          driver-opts: default-load=true

      # setup-buildx-action v4 dropped the `install: true` input; run the
      # equivalent ourselves so CDK's `docker build` is aliased to
      # `docker buildx build` and routes through the buildx instance above
      # (needed for --cache-to type=gha).
      - name: Alias docker build to buildx
        run: docker buildx install

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Install dependencies
        run: npm ci

      - name: Check format
        run: npm run check-format

      # The CDK test's afterAll deletes frontend/dist, so it runs before the
      # real artifact is downloaded below.
      - name: Test CDK
        run: npm test

      - uses: actions/download-artifact@v8
        with:
          name: smithy-output
          path: build/smithy

      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      # cdk.json runs the app through ts-node --prefer-ts-exts, so the emitted
      # lib/*.js are never read; keep the typecheck only.
      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      # src/shared/generated is git-ignored, so a bare checkout has no models and
      # the Lambda bundle would ship without them -- which fails at runtime with
      # "No module named 'src.shared.generated'". CI regenerates from the IDL.
      #
      # setup-python is required, not incidental: UV_SYSTEM_PYTHON makes uv
      # install into the interpreter on PATH, and without it that is /usr, which
      # is externally managed (PEP 668) and refuses. lambda-tests.yml has the same
      # pair (plus a ./lambda default cwd).
      - name: Generate pydantic models from smithy
        working-directory: lambda
        env:
          SMITHY_BUILD_DIR: ${{ github.workspace }}/build/smithy
          UV_SYSTEM_PYTHON: "1"
        run: |
          uv pip install --group dev .
          ./scripts/codegen.sh

      - name: CDK synth
        run: npx cdk synth --all --output build/cdk.out

      - uses: actions/upload-artifact@v7
        with:
          name: cdk-out
          path: build/cdk.out
          retention-days: 1
