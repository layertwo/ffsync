name: frontend-build

on:
  # No push trigger: deploy.yml -> build.yml runs the same npm ci && test &&
  # build on every push to mainline, so this would double up.
  pull_request:
    paths:
     - 'frontend/**'
     - '.github/workflows/frontend-build.yml'
    branches: [ "mainline" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build application
        working-directory: frontend
        run: npm run build
