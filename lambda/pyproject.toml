[project]
name = "ffsync-lambda-handler"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aws-lambda-powertools==3.38.0",
    "boto3==1.43.119",
    "cryptography==50.0.2",
    "pydantic==2.14.2",
    "mohawk==1.1.0",
    "PyJWT==2.15.1",
    "requests==2.34.2",
    "cachetools==7.2.7",
]


[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "black==26.10.1",
    "isort==9.0.2",
    "flake8==7.5.0",
    "Flake8-pyproject==1.2.4",
    "mypy==2.4.1",
    "types-boto3[apigatewaymanagementapi,dynamodb,kms,lambda]==1.43.119",
    "types-requests==2.33.0.20261030",
    "datamodel-code-generator==0.87.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--verbose",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=100",
    "-n=auto"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/generated/*",
]
branch = true
parallel = true
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "pass",
]

[tool.black]
line-length = 100
target-version = ["py314"]
src = ["src/", "tests/"]

[tool.isort]
profile = "black"
src_paths = ["src/", "tests/"]
line_length = 100
# Relative src_paths above are anchored to isort's `directory`, which datamodel-codegen
# overrides to the codegen output dir -- they then miss, `src` looks third-party, and
# generated/ loses the blank line before its first-party imports. Pin it here instead.
# No trailing slash: a known_* entry ending in "/" is os.listdir()-expanded and will crash.
known_first_party = ["src"]

[tool.flake8]
max-line-length = 100
extend-ignore = [
    "E203",  # whitespace before ':'
    "E266",  # too many leading '#' for block comment
    "E501",  # line too long (handled by black)
    "W503",  # line break before binary operator
    "W504",  # line break after binary operator
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    ".eggs",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    ".coverage",
    "htmlcov",
]
per-file-ignores = [
    "__init__.py:F401",  # imported but unused
    "tests/*:S101",      # use of assert detected (if using flake8-bandit)
    "src/shared/models.py:F401", # importing generated models for re-export
    "src/shared/generated/*:F722", # constr field constraints
]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "C90", # mccabe complexity
]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
pretty = true
# Deliberately NOT ignore_missing_imports: it turns an uninstalled stub package into a silent
# Any, so an annotation like `table: "Table"` type-checks while checking nothing. Scope the
# fallback per-module below instead, so a missing stub surfaces as an error.
warn_unused_ignores = true  # keeps the remaining `type: ignore`s from rotting
files = ["src/", "tests/"]
exclude = [
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    "htmlcov",
]
plugins = ["pydantic.mypy"]

# mohawk ships no stubs and has no types-* package on PyPI.
[[tool.mypy.overrides]]
module = ["mohawk", "mohawk.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true  # Use field names rather than aliases for constructors

