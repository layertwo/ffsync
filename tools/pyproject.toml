[project]
name = "ffsync-tools"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "requests==2.34.2",
    "requests-hawk==1.2.1",
    "click==8.5.0",
]


[dependency-groups]
dev = [
    "black==26.10.1",
    "isort==9.0.2",
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 100
